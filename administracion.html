<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Empresarial Minimalista</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body class="login-body">

<div class="login-container" id="loginContainer">
    <img src="assets/logo.png" class="login-logo" alt="Logo">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <div class="input-group">
            <input id="user" type="text" placeholder="Usuario" required>
        </div>
        <div class="input-group">
            <input id="pass" type="password" placeholder="Contraseña" required>
            <span class="material-icons" id="togglePass">visibility</span>
        </div>
        <button type="submit">Ingresar</button>
    </form>
</div>

<div id="mensajeExito">Operación realizada con éxito</div>

<div id="dashboard">

    <div class="sidebar">
        <h2>Empresa</h2>
        <a href="#" onclick="mostrarSeccion('usuarios', this)" class="active">
            <span class="material-icons">people</span>Usuarios
        </a>
        <a href="#" onclick="logout()">
            <span class="material-icons">exit_to_app</span>Cerrar Sesión
        </a>
    </div>

    <div class="content-area">

        <div class="topbar">
            <h1 id="tituloSeccion">Usuarios</h1>
            <span id="topbarUsuario"></span>
        </div>

        <div id="usuarios">

            <div class="controls-container">
                <button class="btn btn-add admin-only" onclick="openFormUsuario()">
                    <span class="material-icons">add</span>Agregar Usuario
                </button>

                <input type="text" id="buscarUsuario" placeholder="Buscar por Usuario o Área...">
            </div>

            <table id="tablaUsuarios">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Contraseña</th>
                    <th>Área</th>
                    <th>Privilegio</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div id="paginacion"></div>

        </div>

        <div id="modalUsuario" class="modal">
            <div class="modal-content">

                <h2 id="tituloFormUsuario">Nuevo Usuario</h2>

                <form id="formUsuario">

                    <input type="text" id="usuario" placeholder="Usuario" required>

                    <div class="input-group">
                        <input type="password" id="contrasena" placeholder="Contraseña" required>
                        <span class="material-icons" id="toggleModalPass">visibility</span>
                    </div>

                    <input type="text" id="area" placeholder="Área" required>

                    <label for="privilegios">Privilegio</label>
                    <select id="privilegios" required>
                        <option value="">Seleccione Privilegio</option>
                        <option value="admin">Administrador</option>
                        <option value="user">Usuario</option>
                    </select>

                    <div class="form-buttons">
                        <button type="button" class="btn-cancelar" onclick="closeFormUsuario()">Cancelar</button>
                        <button type="button" class="btn-save" id="btnGuardar">Guardar</button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

<script src="crud_usuarios.js"></script>
<script src="app.js"></script>

</body>
</html>
